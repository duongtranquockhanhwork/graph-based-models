services:
  # ─── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: finnexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finnexus_db}
      POSTGRES_USER: ${POSTGRES_USER:-finnexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD phải được đặt trong .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Không publish cổng ra host: chỉ backend cần truy cập, và mở 5432 ra
    # ngoài là bề mặt tấn công không cần thiết. Thêm lại khi cần debug bằng
    # psql từ máy host.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finnexus} -d ${POSTGRES_DB:-finnexus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (FastAPI) ───────────────────────────────────────
  #
  # Neo4j đã được gỡ khỏi stack: không có một dòng mã ứng dụng nào kết nối tới
  # nó. Nó từng chiếm ~1 GB RAM và chặn backend khởi động qua healthcheck để
  # phục vụ một cơ sở dữ liệu trống. Đồ thị tri thức phục vụ dự đoán nằm trong
  # repo nghiên cứu (FINNEXUS_ROOT), đồ thị hiển thị dựng trong tiến trình.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finnexus-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-finnexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finnexus_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY phải được đặt trong .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      # Đặt FIREBASE_CREDENTIALS_JSON trong .env thành đường dẫn TRÊN MÁY HOST
      # tới file service-account JSON. Compose mount nó vào container (dưới)
      # và trỏ biến này sang đường dẫn trong container — để trống thì dùng
      # Application Default Credentials.
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:+/run/secrets/firebase.json}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@finnexus.local}
      # Mô hình dự đoán nằm trong repo nghiên cứu, mount read-only ở dưới.
      FINNEXUS_ROOT: /finnexus
      # Claude giải thích bài báo — để trống thì tính năng tự tắt.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
    volumes:
      # Chỉ mount repo nghiên cứu (read-only), KHÔNG mount mã nguồn backend đè
      # lên image. Bản trước mount ./backend:/app, khiến image đã build trở
      # nên vô nghĩa và biến container production thành môi trường dev.
      - ${FINNEXUS_ROOT:-../FinNexus KG}:/finnexus:ro
      # /dev/null khi FIREBASE_CREDENTIALS_JSON để trống — mount vô hại, ứng
      # dụng vẫn tự rơi về Application Default Credentials nhờ biến môi
      # trường tương ứng ở trên rỗng trong trường hợp đó.
      - ${FIREBASE_CREDENTIALS_JSON:-/dev/null}:/run/secrets/firebase.json:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ─── Frontend (React + Nginx) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finnexus-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FinNexus KG">
  <!--
    Biểu tượng FinNexus KG.

    Ý tưởng: bốn nút của đồ thị tri thức được đặt đúng trên đường đi của giá —
    lên, chững lại, rồi lên tiếp. Một hình nói được cả hai vế của sản phẩm:
    mạng liên kết giữa các thực thể, và phản ứng của thị trường.

    Nút cuối sáng và lớn nhất là "chủ thể" — khái niệm trung tâm của hệ thống:
    mỗi bài báo có một mã là tâm điểm, phần còn lại là ngữ cảnh.

    Đường đi cố ý KHÔNG phải một đường chéo thẳng: giá thật không đi thẳng, và
    một biểu tượng vẽ đường thẳng đi lên sẽ hứa hẹn điều mà sản phẩm này từ
    chối hứa.
  -->
  <defs>
    <linearGradient id="fnxTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="fnxEdge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#fnxTile)" />

  <!-- Cạnh nối các nút: vừa là quan hệ trong đồ thị, vừa là đường giá -->
  <g fill="none" stroke="url(#fnxEdge)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 45 L27 31 L40 36 L50 19" />
  </g>

  <!-- Nhánh phụ: một mã cùng ngành, không nằm trên đường chính -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round">
    <path d="M27 31 L24 17" />
  </g>
  <circle cx="24" cy="17" r="3" fill="#ffffff" fill-opacity="0.55" />

  <!-- Các nút trên đường giá -->
  <circle cx="15" cy="45" r="4" fill="#ffffff" fill-opacity="0.8" />
  <circle cx="27" cy="31" r="4" fill="#ffffff" fill-opacity="0.8" />
  <circle cx="40" cy="36" r="4" fill="#ffffff" fill-opacity="0.8" />

  <!-- Nút chủ thể: vòng sáng bao quanh, lớn nhất -->
  <circle cx="50" cy="19" r="8.5" fill="#ffffff" fill-opacity="0.18" />
  <circle cx="50" cy="19" r="6" fill="#ffffff" />
</svg>

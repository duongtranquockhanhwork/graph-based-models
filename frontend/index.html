<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SVG cho trình duyệt hiện đại (nét luôn sắc ở mọi độ phân giải), ICO cho
         trình duyệt cũ và thanh tác vụ Windows. Trước đây trang trỏ tới
         /vite.svg — một file không tồn tại — nên tab hiện icon trắng mặc định. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1d4ed8" />

    <!-- Source Serif 4 cho tiêu đề (phong cách báo tài chính), Inter cho phần
         còn lại — cả hai hỗ trợ đầy đủ dấu tiếng Việt. display=swap để chữ
         hiện ngay bằng font hệ thống trong lúc tải, tránh chớp trắng. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />

    <title>FinNexus KG — Phân tích tin tức chứng khoán Việt Nam</title>
    <meta
      name="description"
      content="Đọc bài báo tài chính tiếng Việt, tìm ra bài nói về mã nào và chuyện gì xảy ra, rồi ước lượng giá thường phản ứng thế nào sau loại tin đó."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

protocol_version: FINNEXUS_KG_EVALUATION_PROTOCOL_V1_0
locked_date: "2026-07-31"
random_seed: 20260731

scope:
  dataset: data/dataset/finnexus_news_stock_2019_2022.csv
  dataset_version: FINNEXUS_RESEARCH_DATASET_V17_1
  graph_features: data/knowledge_graph/temporal_graph_features.csv
  graph_version: FINNEXUS_TEMPORAL_KG_V1_0
  semantic_holdout: data/validation/semantic_ground_truth/semantic_holdout_final.csv
  semantic_holdout_version: SEMANTIC_HOLDOUT_V1_20260727

scientific_status:
  experiment_design: EXPLORATORY_LOCKED_PROTOCOL
  reason: >
    The chronological test split has appeared in earlier preliminary project
    outputs. It is not described as a never-observed confirmatory test set.
  causal_claim_allowed: false
  interpretation: >
    Market targets measure an observational price reaction associated with an
    article, not the causal effect of that article.

semantic_evaluation:
  sampling_unit: NEWS_SYMBOL_RELATION
  bootstrap_group: news_id
  bootstrap_iterations: 1000
  confidence_level: 0.95
  entity_precision_gate:
    point_estimate_min: 0.90
    wilson_lower_bound_min: 0.85
  label_quality_gates:
    event_type_macro_f1_min: 0.70
    sentiment_macro_f1_min: 0.70
    affected_scope_macro_f1_min: 0.70
    impact_level_quadratic_kappa_min: 0.60
  compatibility_note: >
    The frozen holdout no longer contains the original auto labels. The
    reproducible WEAK_RULE_V1 implementation is evaluated as a historical
    baseline. Existing WEAK_RULE_V3_ENTITY_TIERED graph edges are not declared
    directly validated by that benchmark.

predictive_ablation:
  target: primary_reaction_direction_3d
  populations:
    - baseline
    - strict
  chronological_flow:
    validation: train_to_validation
    test: train_plus_validation_to_test
  feature_sets:
    - majority
    - text
    - market
    - graph
    - text_market
    - text_graph
    - text_market_graph
  text:
    analyzer: char_wb
    ngram_range: [3, 5]
    min_df: 2
    max_features: 50000
    sublinear_tf: true
  classifier:
    algorithm: LogisticRegression
    class_weight: balanced
    C: 1.0
    max_iter: 2000
  primary_comparison:
    augmented: text_market_graph
    reference: text_market
    metric: macro_f1
    minimum_delta: 0.02
    bootstrap_iterations: 1000
    bootstrap_group: news_id
    confidence_level: 0.95
    require_ci_lower_above_zero: true
  robustness:
    strict_population_minimum_delta: 0.0

leakage_controls:
  require_unique_sample_id: true
  require_news_disjoint_across_splits: true
  require_graph_feature_cutoff_before_publication_date: true
  allow_same_day_graph_history: false
  allowed_market_features: PRE_EVENT_ONLY
  outcomes_in_prediction_graph: false

decision_rules:
  ready_for_exploratory_kg_modeling:
    - technical_kg_validation_pass
    - no_leakage_violation
    - predictive_ablation_primary_gate_pass
  ready_for_confirmatory_claim:
    - ready_for_exploratory_kg_modeling
    - exact_production_semantic_extractor_validated
    - fresh_never_observed_temporal_test_period
    - confirmatory_protocol_registered_before_labels_are_observed
